  home:
    welcome: Digital Research Skills Australasia (DReSA)
    subtitle: Find training in digital research skills, from workshops to self-paced
      tutorials. We bring it together from research organisations across Australia
      and beyond, so you can search it all in one place.
    events_message: Find upcoming workshops and courses. Most are online.
    materials_message: Learn at your own pace with tutorials, videos and slides.
    workflows_message: Create training workflows to visualise learning steps and link
      to resources specific to your training needs.
    providers_message: See the organisations that share their training through DReSA.
    educators_message: Ask an AI educator a question, or work through a guided module
      with an AI coach.
    trainers_message: Find trainers and the skills they teach.
  footer:
    funded_by: "<p>DReSA is supported by the <a href='https://www.ardc.edu.au/' target='_blank'>Australian
      Research Data Commons (ARDC)</a>. The ARDC is enabled by the National Collaborative
      Research Infrastructure Strategy (NCRIS).</p>"
    acknowledgement: 'We acknowledge and pay respects to the Elders and Traditional
      Owners of the lands on which our partner organisations stand.

      '
  about:
    mtessx: ''
    history: ''
    registry: "<p>DReSA makes it easier for learners, trainers, and training providers
      to find digital research skills-focused educational events and resources.</p>
      <p>Through DReSA, its creators seek to: <ul> <li>Lift Australasian researchers'
      capabilities and skills by improving the findability of events and resources</li>
      <li>Build national, collaborative, training partnerships</li> <li>Strategically
      leverage trainers' and learners' time and resources</li> </ul></p> <p>DReSA began as a grassroots movement among trainers and training providers in Australia and New Zealand to improve the discoverability of digital skills training. It grew out of the ARDC's Australian eResearch and Data Skills Summit in 2020, which led to the National Training Registry and Calendar Working Group. After scoping the landscape, the Working Group chose ELIXIR's TeSS platform as the code base for DReSA, beginning a collaborative partnership with ELIXIR that has exchanged software, ideas and support ever since.</p>\n"
    events: "<p>Events in DReSA are defined as face-to-face or online training opportunities
      that have set start and end times. These primarily take the form of workshops,
      courses, webinars, etc.</p> <p>DReSA also collects information about conferences,
      meetings, and hackathons, as these may also provide opportunities for learning.</p>\n"
    nominatim: "<a href='https://wiki.openstreetmap.org/wiki/Nominatim', target='_blank'>Nominatim</a>"
    materials: 'Materials in DReSA are defined as training resources that can be accessed
      at any time. These may be in a variety of different formats, including online
      tutorials, videos, PowerPoint presentations, and so on.

      '
    workflows: ''
    learning_paths: ''
    concept_maps: ''
    resources: ''
    subscribe: 'DReSA also provides a subscription feature to help users to stay informed
      about training events of interest to them. The service may be customised by
      selecting the relevant filters, and initiated via the subscribe button. Users
      may choose to receive email notifications about upcoming events, or have them
      automatically added to their preferred calendar application.

      '
    widgets: 'providers, institutions and organizations may readily import information,
      about relevant events and materials, to their site using widgets. Alternatively,
      they can create custom feeds using our API.

      '
  developer:
    license: 'DReSA is committed to the FAIR principles: making data findable, accessible,
      interoperable and re-usable. As such, all data in DReSA is available under the
      CC BY 4.0 licence, and can be accessed through our API and widgets. The DReSA
      codebase is also available on <a href="https://github.com/dresa-org-au/TeSS/" target="_blank">GitHub</a>
      for re-use under the BSD Licence.

      '
    code_license: '<a href="https://github.com/dresa-org-au/TeSS/blob/master/LICENSE", target="_blank">BSD
      3-Clause</a>

      '
    data_license: '<a href="https://creativecommons.org/licenses/by/4.0/", target="_blank">Creative
      Commons CC-BY 4.0</a>

      '
    gmaps_countries: "'Australia', 'New Zealand'\n"
    widgets: 'DReSA events and materials can be displayed on your website using widgets.
      There are several different styles and functionalities available from our configurable
      widget suite. The javascript code and documentation about using these widgets
      is available in our detailed documentation guide.

      '
