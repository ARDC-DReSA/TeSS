            class="btn btn-primary", target="_blank" >
            <i class="fa fa-envelope"></i> Join the widgets mailing list</a></p>
    api_example_1: "/events.json_api"
    api_example_2: ''
    api_example_3: "/materials.json_api"
    api_example_4: "/content_providers.json_api"
    api_example_5: "/workflows.json_api"
    swaggerhub: |
      <p>The full documentation for our JSON API with interactive examples can be found in our
        <a href="https://app.swaggerhub.com/apis/fbacall/TeSS-JSON-API/0.2.0", target="_blank">
          Swagger Hub Documentation</a>
      </p> <p><a href="https://app.swaggerhub.com/apis/fbacall/TeSS-JSON-API/0.2.0", class="btn btn-primary", target="_blank">
        View our API on SwaggerHub <img src="/assets/swagger.png", width="20" height="20"></a></p>
      <p>We recommend using our JSON API, but if you have already begun using our old API technical information
        can still be found on our <a href="https://app.swaggerhub.com/api/njall/TeSS/1.0.0/">here</a>.</p>
  us:
    keys:
      built_on_tess: Built on TeSS
      contact: Contact
      history: Our history
      funding: Funding and partners
      acknowledgements: Acknowledgements
      cite: Cite us
    built_on_tess: '<p>DReSA runs on TeSS, the open-source training registry developed by ELIXIR,
      Europe''s research infrastructure for life-science data. We keep DReSA close to the TeSS
      code so that improvements can flow in both directions. The TeSS community meets regularly
      and welcomes contributors; see the <a href="https://elixirtess.github.io/about/"
      target="_blank" rel="noopener">TeSS community site</a>.</p>

      '
    contact: 'For enquiries, information, or assistance; contact the DReSA support
      desk at: <a href="mailto:rob.clemens@ardc.edu.au">rob.clemens@ardc.edu.au</a>

      '
    history: |
      <p>The idea of a national training registry and calendar had been discussed among trainers
      and training providers for some time. DReSA was born out of the need to improve the
      discoverability of training. The Working Group formed at the ARDC Skills Summit in 2020, and
      after scanning the landscape for similar solutions it identified ELIXIR's TeSS platform as the
      best starting point. From there began a collaborative, global partnership with ELIXIR and an
      exchange of the infrastructure that underlies TeSS, as well as ideas, support and
      encouragement.</p>
      <p>The DReSA training registry is developed and delivered in partnership with the Australian
      Research Data Commons (ARDC), the National Computational Infrastructure Australia (NCI), the
      Pawsey Supercomputing Research Centre (Pawsey) and the digital research trainer community.</p>
      <div class="h4">Organisations that established DReSA</div>
      <ul>
        <li>Australian Research Data Commons (ARDC)</li>
        <li>Pawsey Supercomputing Research Centre</li>
        <li>Intersect Australia</li>
        <li>Australian BioCommons</li>
        <li>CSIRO</li>
        <li>Deakin University</li>
        <li>Federation University</li>
        <li>Monash University, including the Data Science and AI Platform</li>
        <li>National Computational Infrastructure (NCI)</li>
        <li>Queensland Cyber Infrastructure Foundation (QCIF)</li>
        <li>Australian Space Data Analysis Facility (ASDAF)</li>
        <li>University of Newcastle</li>
        <li>University of Queensland</li>
        <li>University of Sydney, including the Sydney Informatics Hub</li>
      </ul>
      <p>The Working Group was guided by the ELIXIR TeSS team, the Digital Curation Centre (UK) and
      EIFL. The software was built by an independent software engineer under contract to the
      Working Group.</p>
      <p>DReSA is currently maintained by the ARDC.</p>
    funding: '<p>DReSA was built and is maintained by the National Computational Infrastructure
      (NCI), the <a href="https://pawsey.org.au" target="_blank" rel="noopener">Pawsey Supercomputing
      Research Centre (Pawsey)</a> and the <a href="https://ardc.edu.au" target="_blank"
      rel="noopener">Australian Research Data Commons (ARDC)</a>. ARDC, NCI and Pawsey are funded by
      the National Collaborative Research Infrastructure Strategy (NCRIS).</p>

      '
    acknowledgements: |
      <p>The DReSA team would like to acknowledge the help of a number of groups and thank them
      for useful discussions, feedback and assistance in developing DReSA:</p>
      <ul>
        <li>Members of the ARDC National Training Registry Working Group</li>
        <li>Attendees of eResearch and data skills conferences</li>
        <li><a href="https://tess.elixir-europe.org/" target="_blank" rel="noopener">ELIXIR's Training Platform</a> and the
            <a href="https://elixirtess.github.io/about/" target="_blank" rel="noopener">TeSS community</a></li>
        <li><a href="https://www.dcc.ac.uk/" target="_blank" rel="noopener">The Digital Curation Centre (UK)</a></li>
        <li><a href="https://eosc-portal.eu/" target="_blank" rel="noopener">The European Open Science Cloud</a></li>
      </ul>
      <p>DReSA is based on the ELIXIR TeSS platform.</p>
    cite: |
      <p>To cite DReSA: Digital Research Skills Australasia (DReSA), Australian Research Data Commons,
      <a href="https://dresa.org.au">https://dresa.org.au</a> (accessed [date]).</p>
      <p>DReSA is built on the TeSS platform. To cite TeSS: Niall Beard, Finn Bacall, Aleksandra Nenadic,
      Milo Thurston, Carole A Goble, Susanna-Assunta Sansone, Teresa K Attwood, TeSS: a platform for
      discovering life-science training opportunities, Bioinformatics, Volume 36, Issue 10, 15 May 2020,
      Pages 3290-3291, <a href="https://doi.org/10.1093/bioinformatics/btaa047" target="_blank"
      rel="noopener">https://doi.org/10.1093/bioinformatics/btaa047</a></p>
  register:
    resources: "<p>Adding events to DReSA make them easier to find for learners, trainers
      and other training providers. This can help attract bigger audiences and increase
      the reach and impact of your events.</p>\n"
    methods: '<p>To add an event to DReSA:<ol> <li>Create a user profile, by logging
      in using the Australian Access Federation (AAF)</li> <li>And either:<ul> <li>Use
      our form to register events <a href="#manual">manually</a>, or</li> <li>Contact
      us to develop an <a href="#automatic">automatic registration</a> solution.</li>
      </ul></li></ol></p> <p>Events added to DReSA must be related to digital research
      skills and must take place, or be open to researchers, in the Australasian region.</p>

      '
    automatic: '<p>The DReSA team can provide various automated scraping solutions
      for adding your events to the website. Scrapers are based on the extraction
      of structured metadata from existing websites.</p> <p>If those solutions are
      not applicable, you can contact the DReSA team to discuss potential, alternative
      solutions. This option is particularly useful if you regularly add many events
      to DReSA.</p> <p>For more information on automatically registering events in
      DReSA, refer to the <a href="/DReSA-Ingestion-Guide.pdf" target="_blank">DReSA Ingestion Guide</a>.<p>

      '
    auto_condition_1: Contains more than 3 resources
    auto_condition_2: Has some structured data
    auto_condition_3: Is relevant to life scientists
    structured: '<p>To register resources in TeSS automatically, our scrapers need
      to be able to extract data from target websites reliably. To this end, it is
      helpful if these websites include some structured data.</p> <p>The following
      are examples of the kinds of structured data that we can work with. If your
      website contains one or more of these, and satisfies the criteria above, contact
      us and we will create a scraper.</p> <p>If your website includes no structured
      data, and you’d like your resources added to TeSS, we recommend using <a href="http://bioschemas.org"
      target="_blank">Bioschemas</a> to structure your site.</p>

      '
    schema: "<p><a href='http://schema.org', target='_blank'>Schema.org</a> is a project
      run by a consortiumof search engines. Schema.org has created an extensive library
      of simple, lightweight schemas that web-masters can use to explicitly define
      their websites content in order to improve search engine visibility and interoperability.</p>
      <p>For events, you can use the <a target='_blank', href='http://schema.org/Event'>schema.org
      Event type</a>; and for training materials: <a target='_blank', href='http://schema.org/CreativeWork'>schema.org
      CreativeWork Type</a> </p><p>The schemas provided by schema.org are convoluted,
      and lack some important training-specific fields. As such, a life science community
      group, called <a target='_blank', href='http://bioschemas.org'>Bioschemas</a>,
      has created schema.org extensions with life science-specific vocabularies, which
      add additional fields relevant to the discipline.</p> <p>The Bioschemas group
      is producing tools, documents and training to facilitate adoption of standard
      metadata mark-up.</p>\n"
    bioschema_events: "<a target='_blank', class='btn btn-primary', href='http://bioschemas.org/specifications/Event/specification/'>
      View Events Bioschema</a>\n"
    bioschema_materials: "<a target='_blank', class='btn btn-primary', href='http://bioschemas.org/specifications/TrainingMaterial/specification/'>
      View Materials Bioschema</a>\n"
    schema_example_1: "<a target='_blank', class='btn btn-success', href='https://search.google.com/structured-data/testing-tool#url=https%3A%2F%2Fwww.france-bioinformatique.fr%2Fen%2Fevenements_upcoming'>
      French Institute of Bioinformatics</a>\n"
    schema_example_2: "<a target='_blank', class='btn btn-success', href='https://search.google.com/structured-data/testing-tool#url=https%3A%2F%2Fwww.sib.swiss%2Ftraining%2Fupcoming-training-events'>
      Swiss Institute Bioinformatics</a>\n"
    schema_example_3: ''
    api: "<p>Application Programming Interfaces, or APIs, typically have endpoint
      URLs that, when accessed, return raw, unstyled data in a common exchange format,
      such as XML or JSON.</p> <p>If your website has an API that programmatically
      displays data for your training or event content, the TeSS team can write an
      API client to interface with it.</p>\n"
    api_example_1: "<a target='_blank', class='btn btn-success', href='https://www.training.cam.ac.uk/api/v1/provider/BIOINFO/programmes?fetch=events.sessions,events.topics&format=json'>
      University of Cambridge</a>\n"
    api_example_2: "<a target='_blank', class='btn btn-success', href='https://www.dtls.nl/courses/feed/?filter_course=active'>
      Dutch Techcentre for Lifesciences</a>\n"
    api_example_3: ''
    calendar: "<p>Many organisations use calendar applications to organise and display
      their events. These may be custom-made or, more likely, utilise applications
      like Google Calendar. Calendar applications maintain an underlying file for
      event storage and retrieval, typically in the .ics format.</p> <p>If your website
      has a calendar application, the TeSS team can write a scraper to extract from
      it the date, location and event descriptions, and upload the data to TeSS.</p>\n"
    calendar_example_1: "<a target='_blank', class='btn btn-success', href='https://nbis.se/training/events.html'>NBIS</a>\n"
    calendar_example_2: "<a target='_blank', class='btn btn-success', href='https://software-carpentry.org/workshops/'>
      Software Carpentry</a>\n"
    calendar_example_3: ''
    other_types: "<ul><li><b>RSS Feed</b>: an RSS feed is a type of news format. Many
      websites have such feeds, which list recent posts in a standard format. We can
      write scripts to parse this format;</li> <li><b>Git Repository:</b> a git repository
      is a directory containing files that can be edited collaboratively. If you are
      using GitHub (or similar) to develop your training resources, and/or use GitHub
      Pages to render them, we can write a script that clones the repository and extracts
      resource information. We may ask you to create a metadata file in YAML format
      to help us extract the metadata;</li> <li><b>SOLR server (or similar):</b> a
      SOLR server is a search engine that many sites use for their internal search
      functionality. If you have a publicly accessible SOLR server, we can write a
      script to interface with it; </li> <li><b>Other:</b> if you have training metadata
      in another structured format (e.g., an XML or JSON dump, a CSV file, a YAML
      file, or other format), we would be happy to write a script to parse it.</li></ul>\n"
    advice: 'If your website contains any of the above, or you''d like advice about
      annotating with Bioschemas, you can contact us via e-mail at <a href="mailto:support@tess.elixir-europe.org">support@tess.elixir-europe.org</a>

      '
    manual: "<p>Resources may be added manually to DReSA.</p> <p><ol><li>Create a
      user profile, by logging in using AAF.</li> <li>Click either the <em>Register
      Event</em> button or the <em>Register Material</em> button to register your
      training events or training materials, respectively.</li></ol></p>\n"
  privacy:
    registration: '<p>Registration with DReSA is build upon Australian Access Federation
      (AAF) authentication. When you register, the AAF Display Name will be visible
      at the top of the page.</p> <ul> <li>DReSA delegates authentication to your
      identity provider (IdP). You can view which attributes are shared with DReSA
      by your IdP by using the <a href="https://validator.aaf.edu.au/" target="_blank">AAF
      Validator</a> service. </li> <li>The e-mail address that you provide as a contact
      for an event or resource will be visible when a user views that event/resource.</li>
      </ul>

      '
    personal: 'You may additionally provide a profile, containing your name, a public
      email address, website link and avatar. This information is publicly available
      to all users.

      '
    resources: 'The details of any training materials and events that you register
      will be publicly visible and searchable.

      '
    server: 'When you browse DReSA, the server automatically records logs of which
      pages you access, when you accessed them, and your IP address. These logs are
      used to fix errors and are not shared with any third parties.

      '
    analytics: 'DReSA uses Google Analytics to track how users are discovering DReSA
      and interacting with the service. The information gathered includes which pages
      you visited, which search terms lead you to DReSA and information about your
      web browser. No personally identifiable information is sent to Google.

      '
    retention: 'The information that you enter into DReSA is retained by DReSA until
      you choose to remove it or the DReSA service ceases to exist.

      '
    code: 'DReSA adheres to the <a href=''https://www.oaic.gov.au/privacy/the-privacy-act/''
      target=''_blank''> Australian Privacy Act 1988</a>, which is the principal piece
      of Australian legislation protecting the handling of personal information about
      individuals (<a href=''https://www.ag.gov.au/rights-and-protections/privacy''
      target=''_blank''>https://www.ag.gov.au/rights-and-protections/privacy</a>).

      '
    controller: The data controller for DReSA is TBA.
